<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>КТО ТУТ?</title>
  <link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/style.css?v=31" />
</head>
<body oncontextmenu="return false;">

  <main class="stage" id="stage">
    <img class="layer l-back" src="./media/assets/Back_oPQd.webp" alt="" draggable="false" />

    <section class="panel" id="panel"></section>

    <img class="layer l-frame" id="frame" src="./media/assets/Frame_oPQd.webp" alt="" draggable="false" />
    <img class="layer l-fangrate" src="./media/assets/FanGrate.webp" alt="" draggable="false" />
    <img class="layer l-top" src="./media/assets/Top_oPQd.webp" alt="" draggable="false" />
    <img class="layer l-link1" src="./media/assets/link1_oPQd.webp" alt="" draggable="false" />
    <img class="layer l-steam" src="./media/assets/Steam_oPQd.webp" alt="" draggable="false" />
    <img class="layer l-display" id="display" src="./media/assets/display_oPQd.webp" alt="" draggable="false" />

    <img id="kitty-gif" class="editable-img" src="./media/assets/kitty_oPQd.gif" style="--x:83.17%; --y:76%; --w:3%; --h:auto;" alt="" draggable="false" />

    <img class="layer l-smile" src="./media/assets/Smile_oPQd.webp" alt="" draggable="false" />

    <!-- кнопки и подписи: всегда после всех картинок.
         data-hover="..." = звук при наведении (у кнопок без него звука нет) -->
    <a id="steam-link" class="hit poly" data-hover="./media/audio/steam.ogg"
       style="--x:45.36%; --y:10.44%; --w:5.32%; --h:8.63%;"
       href="https://steamcommunity.com/id/Zero019/" target="_blank" rel="noopener noreferrer"></a>
    <p class="tip" style="--x:46.65%; --y:9.96%; --rot:-27deg; --fs:1.4vw;">Steam</p>

    <a id="kitty-btn" class="hit" style="--x:83.15%; --y:76.14%; --w:2.9%; --h:6.6%;" href="#"></a>

    <a id="display-btn" class="hit" style="--x:50.17%; --y:79.54%; --w:6.6%; --h:3.9%;" href="#"></a>
  </main>

  <div class="noise"></div>
  <div class="vignette"></div>

  <script src="./scripts/main.js?v=29"></script>
</body>
</html>
