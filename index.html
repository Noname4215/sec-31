<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>КТО ТУТ?</title>
  <link rel="stylesheet" href="./css/style.css?v=12" />
</head>
<body oncontextmenu="return false;">

  <main class="stage" id="stage">
    <img class="layer" src="./media/assets/Back_oPQd.webp" alt="" draggable="false" />

    <section class="panel" id="panel"></section>

    <img class="layer" id="frame" src="./media/assets/Frame_oPQd.webp" alt="" draggable="false" />
    <img class="layer" src="./media/assets/Top_oPQd.webp" alt="" draggable="false" />
    <img class="layer" src="./media/assets/link1_oPQd.webp" alt="" draggable="false" />
    <img class="layer" src="./media/assets/Steam_oPQd.webp" alt="" draggable="false" />

    <!-- Смайлик. Если файл того же размера, что рамка, замени класс "smile" на "layer" -->
    <img class="layer" src="./media/assets/Smile_oPQd.webp" alt="" draggable="false" />

    <!-- Кнопка Steam + подпись (подпись обязательно сразу после кнопки) -->
    <a id="steam-link" class="hit poly" style="--x:45.36%; --y:10.44%; --w:5.32%; --h:8.63%;"
       href="https://steamcommunity.com/id/Zero019/" target="_blank" rel="noopener noreferrer"></a>
    <p class="tip" style="--x:44%; --y:6%;">Steam</p>
  </main>

  <div class="noise"></div>
  <div class="vignette"></div>

  <script src="./scripts/main.js?v=12"></script>
</body>
</html>
