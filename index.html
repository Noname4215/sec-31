<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>КТО ТУТ?</title>
  <link rel="stylesheet" href="./css/style.css?v=3" />
</head>
<body oncontextmenu="return false;">

  <!-- Рамка из трёх слоёв. Порядок важен: Back → (панель) → Frame → Top -->
  <main class="stage" id="stage">
    <img class="layer" id="back" src="./media/assets/Back_oPQd.webp" alt="" draggable="false" />

    <!-- Пустая панель. Сюда потом можно класть контент -->
    <section class="panel" id="panel"></section>

    <img class="layer" src="./media/assets/Frame_oPQd.webp" alt="" draggable="false" />
    <img class="layer" src="./media/assets/Top_oPQd.webp" alt="" draggable="false" />
    <img class="layer" src="./media/assets/Smile_oPQd.webp" alt="" draggable="false" />
    <img class="layer" src="./media/assets/link1_oPQd.webp" alt="" draggable="false" />
    <img class="layer" src="./media/assets/Steam_oPQd.webp" alt="" draggable="false" />

    <!-- Невидимые кнопки. Позиции: --x --y --w --h в % от рамки. Открой сайт с ?debug, чтобы их увидеть -->
    <a class="hit" style="--x:54%; --y:10%; --w:7%; --h:12%;"
       href="https://steamcommunity.com/id/Zero019/" target="_blank" rel="noopener noreferrer" title="Steam"></a>
  </main>

  <div class="noise"></div>
  <div class="vignette"></div>

  <script src="./scripts/main.js?v=3"></script>
</body>
</html>
