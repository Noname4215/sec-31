<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>КТО ТУТ?</title>
  <link rel="stylesheet" href="./css/style.css?v=3" />
</head>
<body oncontextmenu="return false;">

  <!-- Рамка из трёх слоёв. Порядок важен: Back → (панель) → Frame → Top -->
  <main class="stage" id="stage">
    <img class="layer" id="back" src="./media/assets/Back_oPQd.webp" alt="" draggable="false" />

    <!-- Пустая панель. Сюда потом можно класть контент -->
    <section class="panel" id="panel"></section>

    <img class="layer" src="./media/assets/Frame_oPQd.webp" alt="" draggable="false" />
    <img class="layer" src="./media/assets/Top_oPQd.webp" alt="" draggable="false" />
    <img class="layer" src="./media/assets/Smile_oPQd.webp" alt="" draggable="false" />
    <img class="layer" src="./media/assets/link1_oPQd.webp" alt="" draggable="false" />
    <img class="layer" src="./media/assets/Steam_oPQd.webp" alt="" draggable="false" />

    <!-- Невидимые кнопки. Позиции: --x --y --w --h в % от рамки. Открой сайт с ?debug, чтобы их увидеть -->
    <p id="title-home" class="home-title invisible">Homepage</p>
    <a id="steam-link" class="hit poly" style="--x:45.36%; --y:10.44%; --w:5.32%; --h:8.63%;"
   href="https://steamcommunity.com" target="_blank" rel="noopener noreferrer" title="Steam"></a>
  </main>

  <div class="noise"></div>
  <div class="vignette"></div>

  <script src="./scripts/main.js?v=3"></script>
  <script>
  const link = document.getElementById('steam-link');
  const title = document.getElementById('title-home');

  link.addEventListener('mouseenter', () => title.classList.remove('invisible'));
  link.addEventListener('mouseleave', () => title.classList.add('invisible'));
</script>
</body>
</html>
